{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-icon">👋</div>
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Student login</h1>
  <p class="muted">Sign in to see your dashboard and event registrations.</p>
  <form method="post" class="panel form">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
    <button class="button" type="submit">Log in →</button>
  </form>
  <p class="hint">New student? <a class="text-link" href="{{ url_for('student_signup') }}">Create an account</a></p>
</div>
{% endblock %}
